<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./index.css" />
  <style>
    :root, [data-theme="dark"] {
      --color-bg: #0d0d0b;
      --color-surface: #111110;
      --color-ink: #4ade80;
      --color-muted: #4a4840;
      --color-accent: #7ab896;
      --color-flash: #7ab896;
      --color-overlay: rgba(13,13,11,0.85);
      --color-scrollbar: rgba(122,184,150,0.35);
      --color-scrollbar-hover: rgba(122,184,150,0.6);
    }
    [data-theme="light"] {
      --color-bg: #f2f2f2;
      --color-surface: #e8e8e8;
      --color-ink: #222222;
      --color-muted: #888888;
      --color-accent: #555555;
      --color-flash: #555555;
      --color-overlay: rgba(150,150,150,0.6);
      --color-scrollbar: rgba(100,100,100,0.35);
      --color-scrollbar-hover: rgba(100,100,100,0.6);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes flashAccent {
      0%   { color: var(--color-muted); }
      20%  { color: var(--color-flash); }
      100% { color: var(--color-muted); }
    }
    .flash {
      animation: flashAccent 1s ease forwards;
    }
    body {
      overflow: hidden;
    }
    .editor-content::-webkit-scrollbar {
      width: 4px;
    }
    .editor-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .editor-content::-webkit-scrollbar-thumb {
      background-color: transparent;
      border-radius: 2px;
    }
    .editor-content.is-scrolling::-webkit-scrollbar-thumb {
      background-color: var(--color-scrollbar);
    }
    .editor-content.is-scrolling::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-scrollbar-hover);
    }
    .editor-content p {
      margin: 0;
    }
    .editor-content p + p {
      margin-top: 1.25em;
    }
  </style>
</head>
<body
  class="bg-background text-ink font-ui"
  x-data="writer()"
  x-init="init()"
  :data-theme="theme"
  @keydown.ctrl.o.window.prevent="openFile()"
  @keydown.ctrl.s.window.prevent="saveFile()"
  @keydown.ctrl.shift.s.window.prevent="saveFileAs()"
  @keydown.ctrl.p.window.prevent="showOptions ? closeOptions() : openOptions()"
  @keydown.escape.window="closeOptions()"
>

  <!-- Watermark -->
  <div class="text-center pt-10 pb-2 fade-in">
    <span class="font-ui text-xs tracking-widest uppercase opacity-20 select-none"
          style="font-variant: small-caps; letter-spacing: 0.3em;">
      Folio
    </span>
  </div>

  <!-- Writing column -->
  <main class="mx-auto px-6 pb-24 fade-in" style="max-width: 680px; padding-top: 80px;">
    <div
      x-ref="editor"
      contenteditable="true"
      @input="onInput()"
      class="w-full bg-transparent text-ink outline-none text-writing editor-content"
      :class="{ 'font-lora': font === 'lora', 'font-libre': font === 'libre', 'font-editor': font === 'courier' }"
      style="height: calc(100vh - 240px); overflow-y: auto; caret-color: var(--color-accent);"
      spellcheck="false"
    ></div>
  </main>

  <!-- Status bar -->
  <footer
    class="fixed bottom-0 left-0 right-0 px-6 py-3 flex justify-between items-center font-ui text-sm"
    style="background-color: var(--color-bg);"
  >
    <!-- Left: filename + browser notice -->
    <div class="flex items-center gap-4">
      <span
        class="transition-colors duration-300"
        :class="statusFlash ? 'flash' : 'text-muted'"
        x-text="filename"
      ></span>
      <template x-if="noFsApi">
        <span class="text-muted text-xs opacity-60">
          Your browser doesn't support direct file access — try Chrome or Edge
          <button @click="noFsApi = false" class="ml-2 opacity-40 hover:opacity-80 transition-opacity">✕</button>
        </span>
      </template>
    </div>

    <!-- Right: counts -->
    <div class="text-muted flex gap-4 tabular-nums">
      <span x-text="wordCount + ' words'"></span>
      <span x-text="charCount + ' chars'"></span>
    </div>
  </footer>

  <!-- Options dialog -->
  <div
    x-show="showOptions"
    x-transition.opacity
    class="fixed inset-0 z-50 flex items-center justify-center"
    style="background: var(--color-overlay);"
    @click.self="closeOptions()"
  >
    <div class="bg-surface rounded-lg px-8 py-7 w-80 fade-in">
      <h2 class="font-ui text-xs tracking-widest uppercase opacity-40 mb-5" style="letter-spacing: 0.25em;">Options</h2>
      <p class="font-ui text-xs text-muted uppercase tracking-widest mb-3" style="letter-spacing: 0.2em;">Font</p>
      <div class="flex flex-col gap-2">
        <template x-for="opt in [{id:'lora',label:'Lora',cls:'font-lora'},{id:'libre',label:'Libre Baskerville',cls:'font-libre'},{id:'courier',label:'Courier Prime',cls:'font-editor'}]" :key="opt.id">
          <button
            @click="setFont(opt.id)"
            :class="[opt.cls, 'text-left px-4 py-2 rounded text-base transition-colors duration-150', font === opt.id ? 'text-ink bg-background' : 'text-muted hover:text-ink']"
            x-text="opt.label"
          ></button>
        </template>
      </div>
      <p class="font-ui text-xs text-muted uppercase tracking-widest mb-3 mt-5" style="letter-spacing: 0.2em;">Theme</p>
      <div class="flex flex-col gap-2">
        <template x-for="opt in [{id:'dark',label:'Dark'},{id:'light',label:'Light'}]" :key="opt.id">
          <button
            @click="setTheme(opt.id)"
            :class="['font-ui text-left px-4 py-2 rounded text-sm transition-colors duration-150', theme === opt.id ? 'text-ink bg-background' : 'text-muted hover:text-ink']"
            x-text="opt.label"
          ></button>
        </template>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    function writer() {
      return {
        content: '',
        filename: 'untitled',
        fileHandle: null,
        wordCount: 0,
        charCount: 0,
        statusFlash: false,
        noFsApi: false,
        showOptions: false,
        font: localStorage.getItem('folio_font') || 'lora',
        theme: localStorage.getItem('folio_theme') || 'dark',

        init() {
          this.noFsApi = typeof window.showOpenFilePicker === 'undefined'
          document.execCommand('defaultParagraphSeparator', false, 'p')
          this.$nextTick(() => {
            this._setEditorHtml('')
            this.$refs.editor.focus()
            let scrollTimer
            this.$refs.editor.addEventListener('scroll', () => {
              this.$refs.editor.classList.add('is-scrolling')
              clearTimeout(scrollTimer)
              scrollTimer = setTimeout(() => this.$refs.editor.classList.remove('is-scrolling'), 1000)
            })
          })
        },

        _setEditorHtml(text) {
          if (!text) {
            this.$refs.editor.innerHTML = '<p><br></p>'
            return
          }
          this.$refs.editor.innerHTML = text.split('\n\n').map(l => `<p>${l || '<br>'}</p>`).join('')
        },

        onInput() {
          this.content = Array.from(this.$refs.editor.children).map(p => p.textContent).join('\n\n')
          this.updateCounts()
        },

        updateCounts() {
          const text = this.content
          this.charCount = text.length
          this.wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length
        },

        async openFile() {
          if (this.noFsApi) return
          try {
            const [handle] = await window.showOpenFilePicker({
              types: [{ description: 'Text files', accept: { 'text/plain': ['.txt'] } }],
              multiple: false,
            })
            this.fileHandle = handle
            this.filename = handle.name
            const file = await handle.getFile()
            const text = await file.text()
            this.content = text
            this._setEditorHtml(text)
            this.updateCounts()
            this.$nextTick(() => this.$refs.editor.focus())
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err)
          }
        },

        async saveFile() {
          if (this.noFsApi) return
          if (this.fileHandle) {
            await this._writeToHandle(this.fileHandle)
            this._flash()
          } else {
            await this.saveFileAs()
          }
        },

        async saveFileAs() {
          if (this.noFsApi) return
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: this.filename.endsWith('.txt') ? this.filename : this.filename + '.txt',
              types: [{ description: 'Text files', accept: { 'text/plain': ['.txt'] } }],
            })
            this.fileHandle = handle
            this.filename = handle.name
            await this._writeToHandle(handle)
            this._flash()
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err)
          }
        },

        async _writeToHandle(handle) {
          const writable = await handle.createWritable()
          await writable.write(this.content)
          await writable.close()
        },

        _flash() {
          this.statusFlash = true
          setTimeout(() => { this.statusFlash = false }, 1000)
        },

        openOptions() {
          this.showOptions = true
        },

        closeOptions() {
          this.showOptions = false
          this.$nextTick(() => this.$refs.editor.focus())
        },

        setFont(f) {
          this.font = f
          localStorage.setItem('folio_font', f)
        },

        setTheme(t) {
          this.theme = t
          localStorage.setItem('folio_theme', t)
        },
      }
    }
  </script>
</body>
</html>
